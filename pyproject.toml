[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realreqs"
version = "0.1.0"
description = "Generate accurate requirements.txt files from real installed package metadata, not guesses or PyPI lookups."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Toqeer Yasir" }
]
dependencies = []

[project.scripts]
realreqs = "realreqs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["realreqs"]